<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0f2f6"><meta name="description" content="MEMO: trinta mundos de memória, diversão e troféus. Jogue offline!"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="styles.css?v=10"><title>MEMO • Jogo de Memória</title></head><body><div id="splash" class="splash" aria-label="Carregando MEMO"><div class="splash-mark">✦</div><strong>MEMO</strong><small>Um mundo de cada vez</small><div class="splash-progress"><span></span></div></div><div id="app" class="app" inert><header class="topbar"><div class="brand"><span class="brand-mark">✦</span><span>MEMO</span></div><div class="top-actions"><button id="musicBtn" class="icon-btn" aria-label="Desativar música de fundo" aria-pressed="true" title="Música de fundo">♫</button><button id="soundBtn" class="icon-btn" aria-label="Desativar áudio" title="Áudio">🔊</button><button id="themeBtn" class="icon-btn" aria-label="Alternar tema" title="Alternar tema">☾</button><button id="fullscreenBtn" class="icon-btn" aria-label="Ativar tela cheia" title="Tela cheia">⛶</button><button id="menuBtn" class="icon-btn menu-btn" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button></div></header><aside id="menu" class="menu" hidden><div class="menu-head"><strong>Seu cantinho ✨</strong><button id="closeMenu" class="small-btn" aria-label="Fechar menu">✕</button></div><button data-menu="play">🎮 Continuar jogando</button><button data-menu="stats">📊 Minhas conquistas</button><button data-menu="hall">🏛️ Hall da Memória</button><button data-menu="lab">🧪 Laboratório da Memória</button><button data-menu="relics">💎 Cofre das Memórias</button><button data-menu="daily">📅 Desafio do Dia</button><button data-menu="calendar">📆 Calendário de Conquistas</button><button data-menu="modes">⚡ Modos especiais</button><button data-menu="backup">💾 Exportar conquistas</button><button data-menu="restore">📂 Restaurar conquistas</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button data-menu="about">💡 Sobre o MEMO</button><button id="installBtn" hidden>📲 Instalar aplicativo</button><button id="splashAudioBtn" type="button" aria-pressed="true">🎬 Vinheta do splash: ligada</button><button id="vibrationBtn" type="button">📳 Vibração: ligada</button><div class="audio-settings"><label for="volumeSlider">🔊 Volume dos efeitos e da música <strong id="volumeValue">170%</strong></label><input id="volumeSlider" type="range" min="0.4" max="2.5" step="0.1" value="1.7"></div><div class="menu-foot">Feito para pequenos momentos felizes.</div></aside><main><section class="hero"><div class="eyebrow"><span class="pulse"></span> DESAFIO DA MEMÓRIA</div><div class="hero-row"><div><h1 id="levelName">Jardim encantado</h1><p id="levelSubtitle">Encontre os pares e desperte sua memória.</p></div><div class="level-chip" id="levelChip">01 <span>/ 30</span></div></div><div class="progress-track"><div id="overallProgress"></div></div><div class="stats-row"><div class="stat"><span>⭐ PONTOS</span><strong id="score">0 pts</strong></div><div class="stat total-stat"><span>🏆 TOTAL GERAL</span><strong id="totalScore">0 pts</strong></div><div class="stat"><span>🎯 PARES</span><strong id="pairs">0/6</strong></div><div class="stat"><span>⏱ TEMPO</span><strong id="clock">00:00</strong></div><div class="stat"><span>🔥 COMBO</span><strong id="combo">×0</strong></div></div></section><section class="board-wrap"><div class="board-top"><span id="mascot" class="mascot" aria-hidden="true">🧠</span><span id="status" role="status" aria-live="polite">Toque em uma carta para começar</span><button id="hintBtn" class="hint-btn" disabled>💡 Dica <span id="hints">2</span></button></div><div id="board" class="board" aria-label="Cartas do jogo"></div></section></main><nav class="bottom-bar" aria-label="Controles do jogo"><button id="resetBtn" class="nav-btn"><span class="nav-icon">↻</span><span>Reset</span></button><button id="startBtn" class="nav-btn primary"><span class="nav-icon">▶</span><span id="startLabel">Start</span></button><button id="aboutBtn" class="nav-btn"><span class="nav-icon">ⓘ</span><span>Sobre</span></button></nav></div><div id="modal" class="modal-layer" hidden><div class="modal-backdrop" data-close="true"></div><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="modalClose" class="modal-close" aria-label="Fechar">✕</button><div id="modalContent"></div></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js?v=10" defer></script></body></html>
